name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Toolchain check
        run: node scripts/verify/check-toolchain.js

      - name: Format check
        run: pnpm run format:check

      - name: Lint (zero warnings)
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:unit

      - name: Contract tests
        run: pnpm run test:contract

      - name: Coverage
        run: pnpm run test:coverage

      - name: Build (includes the dist/ build security gate)
        run: pnpm run build

      - name: Consumer package tests (pack + install + build + runtime smoke)
        run: pnpm run test:consumer

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests (chromium, firefox, webkit)
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
