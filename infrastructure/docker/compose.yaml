name: chicek-lab

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

x-restart-policy: &default-restart "on-failure:5"

services:
  reverse-proxy:
    build:
      context: ./reverse-proxy
      dockerfile: Dockerfile
    image: chicek-lab/reverse-proxy:6.0.0
    user: "${LAB_UID:-101}:${LAB_GID:-101}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=8m,mode=1777
    volumes:
      # A directory bind mount, not two single-file mounts: a rotated TLS
      # cert/key must take effect on an `nginx -s reload` alone, and
      # single-file binds pin an already-running container to the inode
      # they saw at mount time (see scripts/lab/common.mjs's tlsLeafDir
      # comment — same underlying hazard as proxy-dynamic below). Only the
      # leaf cert/key live here; the CA private key stays in .runtime/certs,
      # which is never mounted into any container.
      - ../../.runtime/generated/tls-leaf:/etc/chicek/tls:ro
      # A directory bind mount, not two single-file mounts: the kill switch
      # must take effect on an `nginx -s reload` alone, and single-file
      # binds pin an already-running container to the inode they saw at
      # mount time (see scripts/lab/common.mjs's proxyDynamicDir comment).
      - ../../.runtime/generated/proxy-dynamic:/etc/chicek/dynamic:ro
    networks:
      - app-internal
      - observability-internal
      # See the `edge-publish` network comment below: a Docker `internal:
      # true` network structurally refuses to publish any host port for its
      # member containers, so reverse-proxy also joins the narrow,
      # non-internal `edge-publish` network purely to make 127.0.0.1:8443
      # reachable. It never uses that network for east-west traffic.
      - edge-publish
    ports:
      - "127.0.0.1:8443:8443"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-check-certificate",
          "-q",
          "-O",
          "/dev/null",
          "https://127.0.0.1:8443/healthz",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    depends_on:
      browser-app:
        condition: service_healthy
      http-test-service:
        condition: service_healthy
      telemetry-ingest:
        condition: service_healthy
      observability-control-plane:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
          pids: 128
        reservations:
          memory: 64M
    logging: *default-logging
    restart: *default-restart

  browser-app:
    build:
      context: ../../
      dockerfile: infrastructure/docker/browser-app-fixture/Dockerfile
    image: chicek-lab/browser-app-fixture:6.0.0
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=8m,mode=1777
    networks:
      - app-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 128
        reservations:
          memory: 32M
    logging: *default-logging
    restart: *default-restart

  http-test-service:
    build:
      context: ../../tests/fixtures/apps/http-test-service
      dockerfile: ../../../../infrastructure/docker/http-test-service-fixture/Dockerfile
    image: chicek-lab/http-test-service-fixture:6.0.0
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - app-internal
    environment:
      PORT: "4311"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4311/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 128
        reservations:
          memory: 32M
    logging: *default-logging
    restart: *default-restart

  telemetry-ingest:
    build:
      context: ../../
      dockerfile: infrastructure/docker/telemetry-node/Dockerfile
    image: chicek-lab/telemetry-ingest:6.0.0
    user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
    command: ["node", "apps/telemetry-ingest/src/server.js"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    secrets:
      - rabbitmq_ingest_username
      - rabbitmq_ingest_password
    networks:
      - observability-internal
    environment:
      PORT: "4313"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_INGEST_USERNAME_FILE: "/run/secrets/rabbitmq_ingest_username"
      RABBITMQ_INGEST_PASSWORD_FILE: "/run/secrets/rabbitmq_ingest_password"
      RUM_MAX_BYTES: "65536"
      LOGS_MAX_BYTES: "32768"
      PUBLISH_CONFIRM_TIMEOUT_MS: "5000"
      OBSERVABILITY_CONTROL_URL: "http://observability-control-plane:4314/observability/control.json"
      OBSERVABILITY_CONTROL_TIMEOUT_MS: "1000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4313/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    depends_on:
      rabbitmq:
        condition: service_healthy
      observability-control-plane:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
          pids: 128
        reservations:
          memory: 64M
    logging: *default-logging
    restart: *default-restart

  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    image: chicek-lab/rabbitmq:6.0.0
    hostname: rabbitmq
    user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=16m,mode=1777
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    secrets:
      - rabbitmq_admin_username
      - rabbitmq_admin_password
      - rabbitmq_ingest_username
      - rabbitmq_ingest_password
      - rabbitmq_worker_username
      - rabbitmq_worker_password
      - rabbitmq_monitoring_username
      - rabbitmq_monitoring_password
    networks:
      - observability-internal
      - edge-publish
    environment:
      HOME: "/var/lib/rabbitmq"
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "for i in $(seq 1 45); do test -f /tmp/chicek-rabbitmq-ready && rabbitmq-diagnostics -q ping && exit 0; sleep 1; done; exit 1",
        ]
      interval: 10s
      timeout: 50s
      start_period: 40s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
          pids: 512
        reservations:
          memory: 256M
    logging: *default-logging
    restart: *default-restart

  telemetry-delivery-worker:
    build:
      context: ../../
      dockerfile: infrastructure/docker/telemetry-node/Dockerfile
    image: chicek-lab/telemetry-delivery-worker:6.0.0
    user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
    command: ["node", "apps/telemetry-delivery-worker/src/worker.js"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ../../.runtime/generated/proxy-dynamic:/etc/chicek/dynamic:ro
    secrets:
      - rabbitmq_worker_username
      - rabbitmq_worker_password
      - openobserve_rum_ingest_token
      - openobserve_delivery_ops_ingest_token
    networks:
      - observability-internal
    environment:
      PORT: "4316"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_WORKER_USERNAME_FILE: "/run/secrets/rabbitmq_worker_username"
      RABBITMQ_WORKER_PASSWORD_FILE: "/run/secrets/rabbitmq_worker_password"
      OPENOBSERVE_INTERNAL_URL: "http://openobserve:5080"
      OPENOBSERVE_RUM_TOKEN_FILE: "/run/secrets/openobserve_rum_ingest_token"
      OPENOBSERVE_DELIVERY_OPS_TOKEN_FILE: "/run/secrets/openobserve_delivery_ops_ingest_token"
      DELIVERY_CONTROL_FILE: "/etc/chicek/dynamic/delivery-control.json"
      WORKER_PREFETCH: "16"
      OPENOBSERVE_DELIVERY_TIMEOUT_MS: "10000"
      OPS_EMIT_INTERVAL_MS: "30000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4316/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    depends_on:
      rabbitmq:
        condition: service_healthy
      openobserve:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
          pids: 160
        reservations:
          memory: 96M
    logging: *default-logging
    restart: *default-restart

  observability-control-plane:
    build:
      context: ../../
      dockerfile: infrastructure/docker/telemetry-node/Dockerfile
    image: chicek-lab/observability-control-plane:6.0.0
    user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
    command: ["node", "apps/observability-control-plane/src/server.js"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ../../.runtime/control-plane:/var/lib/chicek-control-plane
    networks:
      - observability-internal
    environment:
      PORT: "4314"
      OBSERVABILITY_CONTROL_STATE_DIR: "/var/lib/chicek-control-plane"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4314/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 96
        reservations:
          memory: 32M
    logging: *default-logging
    restart: *default-restart

  session-metadata-sync:
    build:
      context: ../../
      dockerfile: infrastructure/docker/telemetry-node/Dockerfile
    image: chicek-lab/session-metadata-sync:6.0.0
    user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
    command: ["node", "apps/session-metadata-sync/src/server.js"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ../../.runtime/session-metadata-state:/var/lib/chicek-session-metadata
    secrets:
      - openobserve_session_read_token
      - openobserve_session_write_token
    networks:
      - observability-internal
    environment:
      PORT: "4315"
      OPENOBSERVE_INTERNAL_URL: "http://openobserve:5080"
      OPENOBSERVE_SESSION_READ_USERNAME: "chicek-session-metadata-read@chicek-lab.invalid"
      OPENOBSERVE_SESSION_WRITE_USERNAME: "chicek-session-metadata-write@chicek-lab.invalid"
      OPENOBSERVE_SESSION_READ_TOKEN_FILE: "/run/secrets/openobserve_session_read_token"
      OPENOBSERVE_SESSION_WRITE_TOKEN_FILE: "/run/secrets/openobserve_session_write_token"
      SESSION_METADATA_WATERMARK_PATH: "/var/lib/chicek-session-metadata/watermark.json"
      SESSION_METADATA_SYNC_INTERVAL_MS: "60000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4315/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    depends_on:
      openobserve:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 96
        reservations:
          memory: 48M
    logging: *default-logging
    restart: *default-restart

  alert-sink:
    build:
      context: ../../tests/fixtures/apps/http-test-service
      dockerfile: ../../../../infrastructure/docker/http-test-service-fixture/Dockerfile
    image: chicek-lab/http-test-service-fixture:6.0.0
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777
    # OpenObserve v0.91.0 blocks private-IP destinations by default and has
    # no allowlist besides ZO_SSRF_ALLOW_LOOPBACK (verified in resilience by
    # extracting the pinned v0.91.0 binary's own config-key strings — no
    # ZO_SSRF_ALLOWED_HOSTS/CIDR equivalent exists in this version). Given
    # "no OpenObserve upgrade" and "no custom gateway/transport" are both
    # out of scope for this lab, alert-sink reaching OpenObserve only via
    # loopback is a hard constraint, not a design preference — full network
    # namespace independence is not achievable here without breaking alert
    # delivery outright. See docs/operations-runbook.md "Alert
    # sink architecture" for the full writeup.
    #
    # security-acceptance finding (residual risk, now closed): restarting (not
    # recreating) the openobserve container alone previously left
    # alert-sink unable to reach 127.0.0.1:4312 from openobserve's side
    # afterward, even though both containers' own healthchecks stayed green
    # (each only checks its own /health, not the cross-container path).
    # `depends_on.openobserve.restart: true` below closes this: Compose
    # itself now restarts alert-sink automatically whenever openobserve is
    # restarted, so the shared-namespace coupling can no longer silently
    # go stale. This is belt-and-suspenders — resilience's end-to-end
    # notification-readiness probe (scripts/performance/lib/
    # notification-readiness.mjs) is the layer that actually detects a
    # silent break, independent of this auto-restart or of either
    # container's own health status.
    network_mode: "service:openobserve"
    environment:
      PORT: "4312"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4312/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    depends_on:
      openobserve:
        condition: service_healthy
        restart: true
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
          pids: 64
        reservations:
          memory: 32M
    logging: *default-logging
    restart: *default-restart

  openobserve:
    build:
      context: ./openobserve
      dockerfile: Dockerfile
    image: chicek-lab/openobserve:6.0.0
    user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - openobserve-data:/data
    secrets:
      - openobserve_root_email
      - openobserve_root_password
      - openobserve_rum_ingest_token
    networks:
      - observability-internal
      - edge-publish
    ports:
      - "127.0.0.1:5080:5080"
    environment:
      ZO_DATA_DIR: /data
      ZO_TELEMETRY: "false"
      ZO_MMDB_DISABLE_DOWNLOAD: "true"
      ZO_HTTP_PORT: "5080"
      # Do not enable OpenObserve's own web-UI RUM instrumentation here.
      # The lab observes tests/fixtures/apps/browser-app through the browser package and
      # the reverse-proxy ingestion allowlist; instrumenting the OpenObserve
      # admin UI itself makes it emit /rum and /replay requests to the
      # browser-facing self-signed endpoint, which can freeze the operator UI
      # and conflicts with this project's session-replay-closed decision.
      #
      # The real demo RUM config is generated by scripts/lab/generate-runtime-config.mjs
      # after lab:up fetches OpenObserve's server-generated rumtoken.
      # Lab-only: lets the local alert sink receive notifications over
      # OpenObserve's loopback interface while private Docker-network IPs
      # remain blocked by the v0.91.0 SSRF guard.
      ZO_SSRF_ALLOW_LOOPBACK: "true"
      # Live-verified fix (not a version issue — same pinned v0.91.0 binary):
      # OpenObserve's native Alert History panel reads each org's own
      # "triggers" stream, which is only ever written when usage
      # self-reporting is both enabled and told to copy into the org's own
      # stream (not just _meta). Without these, the History drawer's own
      # read API is real and stable in shape but permanently empty, even
      # seconds after a genuine, confirmed fire — see
      # docs/openobserve-v0.91-alert-capabilities.md capability "Alert
      # history" for the full before/after evidence. ZO_USAGE_PUBLISH_INTERVAL
      # is shortened from OpenObserve's own 600s default to keep the lab's
      # feedback loop fast during manual alert testing; it only affects how
      # often buffered usage/history records get flushed to disk, not
      # anything ingested through the normal RUM/logs path.
      ZO_USAGE_REPORTING_ENABLED: "true"
      ZO_USAGE_REPORT_TO_OWN_ORG: "true"
      ZO_USAGE_PUBLISH_INTERVAL: "15"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3G
          pids: 512
        reservations:
          memory: 256M
    logging: *default-logging
    restart: *default-restart

networks:
  app-internal:
    internal: true
  observability-internal:
    internal: true
  # Not internal: true by necessity, not by choice. Docker refuses to
  # publish a host port for a container whose only networks are `internal:
  # true` (verified empirically — see the reference-lab final report). Only
  # reverse-proxy and openobserve join this network, and only to make their
  # two loopback-bound host ports reachable; all inter-service traffic
  # still flows over app-internal/observability-internal.
  edge-publish: {}

volumes:
  openobserve-data:
  rabbitmq-data:

secrets:
  openobserve_root_email:
    file: ../../.runtime/secrets/openobserve-root-email
  openobserve_root_password:
    file: ../../.runtime/secrets/openobserve-root-password
  openobserve_rum_client_token:
    file: ../../.runtime/secrets/openobserve-rum-client-token
  openobserve_rum_ingest_token:
    file: ../../.runtime/secrets/openobserve-rum-ingest-token
  openobserve_delivery_ops_ingest_token:
    file: ../../.runtime/secrets/openobserve-delivery-ops-ingest-token
  openobserve_session_read_token:
    file: ../../.runtime/secrets/openobserve-session-read-token
  openobserve_session_write_token:
    file: ../../.runtime/secrets/openobserve-session-write-token
  rabbitmq_admin_username:
    file: ../../.runtime/secrets/rabbitmq-admin-username
  rabbitmq_admin_password:
    file: ../../.runtime/secrets/rabbitmq-admin-password
  rabbitmq_ingest_username:
    file: ../../.runtime/secrets/rabbitmq-ingest-username
  rabbitmq_ingest_password:
    file: ../../.runtime/secrets/rabbitmq-ingest-password
  rabbitmq_worker_username:
    file: ../../.runtime/secrets/rabbitmq-worker-username
  rabbitmq_worker_password:
    file: ../../.runtime/secrets/rabbitmq-worker-password
  rabbitmq_monitoring_username:
    file: ../../.runtime/secrets/rabbitmq-monitoring-username
  rabbitmq_monitoring_password:
    file: ../../.runtime/secrets/rabbitmq-monitoring-password
