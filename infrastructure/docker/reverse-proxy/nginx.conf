worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    map $http_host $ingestion_host_ok {
        default 0;
        "localhost:8443" 1;
        "127.0.0.1:8443" 1;
    }

    map "$http_origin|$http_sec_fetch_site|$http_sec_fetch_mode" $ingestion_origin_ok {
        default 0;
        "~^https://localhost:8443\|" 1;
        "~^https://127\.0\.0\.1:8443\|" 1;
        "null|same-origin|no-cors" 1;
    }

    map $http_host $observability_scope_service {
        default "";
        "localhost:8443" "browser-app";
        "127.0.0.1:8443" "browser-app-alt";
    }

    map $http_host $observability_scope_environment {
        default "";
        "localhost:8443" "lab";
        "127.0.0.1:8443" "lab";
    }

    map $http_host $observability_scope_version {
        default "";
        "localhost:8443" "2026.07.1";
        "127.0.0.1:8443" "2026.07.1";
    }

    map $http_sec_fetch_site $ingestion_fetch_site_ok {
        default 0;
        "" 1;
        "~*^same-origin$" 1;
    }

    map $http_content_encoding $ingestion_encoding_ok {
        default 0;
        "" 1;
    }

    map $http_content_type $ingestion_content_type_ok {
        default 0;
        "~*^\s*text/plain\s*(;\s*charset\s*=\s*utf-8\s*)?\s*$" 1;
    }

    # General app access logs intentionally exclude query strings and
    # request bodies. Ingestion locations override this with an even
    # narrower metadata-only log format below.
    log_format lab_access
        '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
        '$status $body_bytes_sent "$http_user_agent"';
    log_format ingestion_access escape=json
        '{"timestamp":"$time_iso8601",'
        '"endpoint":"$ingestion_endpoint_class",'
        '"status":$status,'
        '"request_length":$request_length,'
        '"request_time":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"rate_limit":"$limit_req_status"}';
    access_log /tmp/access.log lab_access;
    error_log /tmp/error.log warn;

    sendfile on;
    keepalive_timeout 15s;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 10s;
    client_max_body_size 64k;
    client_body_buffer_size 16k;
    client_body_temp_path /tmp/nginx-client-body 1 2;
    large_client_header_buffers 4 8k;

    limit_req_zone $binary_remote_addr zone=lab_per_ip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=lab_conn:10m;
    limit_req_zone $binary_remote_addr zone=ingest_rum_per_ip:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ingest_logs_per_ip:10m rate=30r/s;
    limit_req_zone $server_name zone=ingest_global:10m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=ingest_conn_per_ip:10m;
    limit_conn_zone $server_name zone=ingest_conn_global:10m;
    limit_req_status 429;
    limit_conn_status 429;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lab_ssl:2m;
    ssl_session_timeout 10m;

    include /etc/nginx/conf.d/app.conf;
}
