worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    # Never logs the query string or a request body — only method + path.
    log_format lab_access
        '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
        '$status $body_bytes_sent "$http_user_agent"';
    access_log /tmp/access.log lab_access;
    error_log /tmp/error.log warn;

    sendfile on;
    keepalive_timeout 15s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    client_max_body_size 64k;
    large_client_header_buffers 4 8k;

    limit_req_zone $binary_remote_addr zone=lab_per_ip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=lab_conn:10m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!RC4;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lab_ssl:2m;
    ssl_session_timeout 10m;

    include /etc/nginx/conf.d/app.conf;
}
