    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    error_page 400 = @ingestion_400;
    error_page 401 = @ingestion_401;
    error_page 403 = @ingestion_403;
    error_page 404 = @ingestion_404;
    error_page 405 = @ingestion_405;
    error_page 408 = @ingestion_408;
    error_page 413 = @ingestion_413;
    error_page 414 = @ingestion_414;
    error_page 415 = @ingestion_415;
    error_page 429 = @ingestion_429;
    error_page 500 = @ingestion_502;
    error_page 502 = @ingestion_502;
    error_page 503 = @ingestion_502;
