# Exact OpenObserve RUM / browser-logs ingestion allowlist.
#
# The two locations below were derived by capturing real network traffic
# from the actual @openobserve/browser-rum + @openobserve/browser-logs
# 0.3.4 SDKs (packages/browser-observability/src/adapter/openobserve/)
# running against this reverse-proxy + openobserve pair. Stage 12 keeps only
# these exact browser-facing paths open and moves OpenObserve's token query
# to an internal upstream-only query generated from the Docker secret:
#
#   POST /rum/v1/default/rum   content-type: text/plain[; charset=utf-8]
#   POST /rum/v1/default/logs  content-type: text/plain[; charset=utf-8]
#
# Path shape is fixed by the SDK's own endpoint builder
# (`/rum/{apiVersion}/{organizationIdentifier}/{rum|logs}`) combined with
# this lab's apiVersion="v1"/organizationIdentifier="default" runtime
# config; it is not a path chosen by this proxy. Everything else
# OpenObserve-shaped — UI, search, users, orgs, streams, dashboards,
# alerts, source-map APIs, session replay ingestion, any other org/api
# version — stays denied below with no wildcard proxy_pass to openobserve.

location = /rum/v1/default/rum {
    set $ingestion_endpoint_class "rum";
    if ($request_method != POST) {
        return 405;
    }
    if ($args != "") {
        return 404;
    }
    if ($request_uri != "/rum/v1/default/rum") {
        return 404;
    }
    if ($ingestion_host_ok != 1) {
        return 403;
    }
    if ($ingestion_origin_ok != 1) {
        return 403;
    }
    if ($ingestion_fetch_site_ok != 1) {
        return 403;
    }
    if ($ingestion_encoding_ok != 1) {
        return 415;
    }
    if ($ingestion_content_type_ok != 1) {
        return 415;
    }

    access_log /tmp/ingestion-access.log ingestion_access;
    client_max_body_size 64k;
    client_body_timeout 5s;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 10s;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_intercept_errors on;
    limit_req zone=ingest_rum_per_ip burst=20 nodelay;
    limit_req zone=ingest_global burst=100 nodelay;
    limit_conn ingest_conn_per_ip 20;
    limit_conn ingest_conn_global 200;

    set $openobserve_upstream "http://openobserve:5080";
    include /tmp/ingestion-upstream-secret.conf;
    proxy_pass_request_headers off;
    proxy_set_header Host "openobserve:5080";
    proxy_set_header Content-Type "text/plain;charset=UTF-8";
    proxy_hide_header Set-Cookie;
    proxy_hide_header WWW-Authenticate;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Request-Id;
    proxy_hide_header X-Trace-Id;
    proxy_hide_header X-OpenObserve-Error;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    error_page 400 = @ingestion_400;
    error_page 401 = @ingestion_401;
    error_page 403 = @ingestion_403;
    error_page 404 = @ingestion_404;
    error_page 405 = @ingestion_405;
    error_page 408 = @ingestion_408;
    error_page 413 = @ingestion_413;
    error_page 414 = @ingestion_414;
    error_page 415 = @ingestion_415;
    error_page 429 = @ingestion_429;
    error_page 500 = @ingestion_502;
    error_page 502 = @ingestion_502;
    error_page 503 = @ingestion_502;
    error_page 504 = @ingestion_504;
    proxy_pass $openobserve_upstream$uri?$openobserve_rum_query;
}

