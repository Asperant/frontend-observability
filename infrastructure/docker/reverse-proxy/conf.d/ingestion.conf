# Deny-by-default placeholder for OpenObserve ingestion/management surface.
#
# Stage 6 intentionally does NOT proxy anything to the openobserve service:
# there is no upstream, no wildcard proxy_pass, and no browser SDK yet. Every
# unknown path under /observability/ and every /api/* path (OpenObserve's
# search, stream, dashboard, alert, user/org, and source-map APIs all live
# under /api/<org>/...) is rejected here instead of silently falling through
# to the demo-frontend catch-all location.
#
# The exact RUM / browser-log / session-replay ingestion allowlist is added
# in a later stage, once real SDK network traffic has been verified.

location /observability/ {
    return 404;
}

location /api/ {
    return 403;
}

# Defense in depth: without these, an unrecognized path would silently fall
# through to the demo-frontend catch-all location (a harmless SPA-fallback
# 200, since there is still no route to openobserve — but an explicit deny
# is clearer than relying on that fallback for anything OpenObserve-shaped).
location ~ ^/(web|config|es|aws|gcp|otlp|prometheus|cloud|license|node)(/|$) {
    return 404;
}
