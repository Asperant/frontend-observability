# Stage 8 exact OpenObserve RUM / browser-logs ingestion allowlist.
#
# The two locations below were derived by capturing real network traffic
# from the actual @openobserve/browser-rum + @openobserve/browser-logs
# 0.3.4 SDKs (packages/browser-observability/src/adapter/openobserve/)
# running against this reverse-proxy + openobserve pair — not guessed. Only
# these exact path + method + content-type combinations are proxied
# through:
#
#   POST /rum/v1/default/rum   content-type: text/plain;charset=UTF-8
#   POST /rum/v1/default/logs  content-type: text/plain;charset=UTF-8
#
# Path shape is fixed by the SDK's own endpoint builder
# (`/rum/{apiVersion}/{organizationIdentifier}/{rum|logs}`) combined with
# this lab's apiVersion="v1"/organizationIdentifier="default" runtime
# config; it is not a path chosen by this proxy. Everything else
# OpenObserve-shaped — UI, search, users, orgs, streams, dashboards,
# alerts, source-map APIs, session replay ingestion, any other org/api
# version — stays denied below exactly as in Stage 6, with no wildcard
# proxy_pass to openobserve anywhere in this file.

location = /rum/v1/default/rum {
    if ($request_method != POST) {
        return 405;
    }
    if ($http_content_type != "text/plain;charset=UTF-8") {
        return 415;
    }
    set $openobserve_upstream "http://openobserve:5080";
    proxy_pass $openobserve_upstream;
}

location = /rum/v1/default/logs {
    if ($request_method != POST) {
        return 405;
    }
    if ($http_content_type != "text/plain;charset=UTF-8") {
        return 415;
    }
    set $openobserve_upstream "http://openobserve:5080";
    proxy_pass $openobserve_upstream;
}

# Defense in depth: session replay ingestion, any other stream/org/api
# version under /rum/, is denied explicitly rather than left to fall
# through to the demo-frontend catch-all (exact `location =` matches above
# always win over this prefix match regardless of declaration order).
location /rum/ {
    return 404;
}

location /observability/ {
    return 404;
}

location /api/ {
    return 403;
}

# Defense in depth: without these, an unrecognized path would silently fall
# through to the demo-frontend catch-all location (a harmless SPA-fallback
# 200, since there is still no route to openobserve for them — but an
# explicit deny is clearer than relying on that fallback for anything
# OpenObserve-shaped).
location ~ ^/(web|config|es|aws|gcp|otlp|prometheus|cloud|license|node)(/|$) {
    return 404;
}
