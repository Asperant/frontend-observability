# Included once inside the server{} block in app.conf. Server-wide security
# posture: response headers, method allowlist, rate/connection limiting,
# and stripping of anything the browser must never be allowed to forward
# upstream (cookies, Authorization).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'" always;

# Method allowlisting moved from one blanket check here (reference-lab: this lab
# only ever served reads) to an `if ($request_method ...) { return 405; }`
# in each individual location (app.conf/ingestion.conf) as of OpenObserve integration: an
# `if` directly in the server block (as opposed to inside a location) runs
# in nginx's server-rewrite phase, before location matching, so it cannot
# be selectively relaxed for the two POST-only RUM/browser-logs ingestion
# locations OpenObserve integration adds — every location now declares its own allowed
# methods explicitly instead of relying on a shared server-level default.

limit_req zone=lab_per_ip burst=40 nodelay;
limit_conn lab_conn 200;

# Never forward the browser's own cookies or an Authorization header
# upstream, and never let an upstream set a cookie back through us.
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_hide_header Set-Cookie;

proxy_connect_timeout 2s;
proxy_send_timeout 5s;
proxy_read_timeout 10s;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
