# Included once inside the server{} block in app.conf. Server-wide security
# posture: response headers, method allowlist, rate/connection limiting,
# and stripping of anything the browser must never be allowed to forward
# upstream (cookies, Authorization).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'" always;

# Exact method allowlist: this lab only ever serves reads in Stage 6.
if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

limit_req zone=lab_per_ip burst=40 nodelay;
limit_conn lab_conn 200;

# Never forward the browser's own cookies or an Authorization header
# upstream, and never let an upstream set a cookie back through us.
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_hide_header Set-Cookie;

proxy_connect_timeout 5s;
proxy_send_timeout 10s;
proxy_read_timeout 10s;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
