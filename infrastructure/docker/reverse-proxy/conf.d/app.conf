server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/frontend-observability/tls/localhost.crt;
    ssl_certificate_key /etc/frontend-observability/tls/localhost.key;

    # Docker's embedded DNS — re-resolve upstream service names at request
    # time instead of caching the IP nginx saw at startup, so a restarted
    # browser-app/http-test-service-fixture container is picked up without a proxy reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/security.conf;

    # runtime-control reverse-proxy kill switch: a single generated `set` directive
    # (scripts/lab/proxy-gate.mjs), included at server level so
    # $frontend_observability_kill_switch_active is available to every location below
    # (including the two exact ingestion locations in ingestion.conf) before
    # any location-specific logic runs.
    include /etc/frontend-observability/dynamic/proxy-gate.conf;

    location = /healthz {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /observability/config.json {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        if ($args != "") {
            return 404;
        }
        proxy_pass_request_headers off;
        proxy_set_header Host "observability-control-plane:4314";
        proxy_set_header X-Observability-Service $observability_scope_service;
        proxy_set_header X-Observability-Environment $observability_scope_environment;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Server;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        proxy_pass http://observability-control-plane:4314/observability/config.json;
    }

    location = /observability/control.json {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        if ($args != "") {
            return 404;
        }
        proxy_pass_request_headers off;
        proxy_set_header Host "observability-control-plane:4314";
        proxy_set_header X-Observability-Service $observability_scope_service;
        proxy_set_header X-Observability-Environment $observability_scope_environment;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Server;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        proxy_pass http://observability-control-plane:4314/observability/control.json;
    }

    # The browser-app's own static test-fixture configs (tests/fixtures/apps/browser-app/
    # public/observability/*.json — served by browser-app's nginx itself,
    # not by this proxy) back the "Lifecycle" scenario buttons in the demo UI
    # (invalid/expired/disabled config, duplicate/concurrent/conflicting
    # initialize). Without an exact-match allowlist entry each of these, they
    # fell through to ingestion.conf's blanket `location /observability/ {
    # return 404; }` — the same defense-in-depth deny that (correctly) blocks
    # anything else OpenObserve-shaped under this path — so every one of
    # those buttons failed with a generic CONFIG_HTTP_ERROR regardless of
    # what it was meant to demonstrate. These four are static, secret-free,
    # repo-committed fixture files (no different in sensitivity from
    # config.json/control.json above); listing each by exact filename here
    # preserves the "no wildcard under /observability/" security posture
    # while letting the buttons that reference them actually work again.
    location = /observability/valid-enabled.json {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        set $browser_app_upstream "http://browser-app:8080";
        proxy_pass $browser_app_upstream;
    }

    location = /observability/valid-disabled.json {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        set $browser_app_upstream "http://browser-app:8080";
        proxy_pass $browser_app_upstream;
    }

    location = /observability/invalid-schema.json {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        set $browser_app_upstream "http://browser-app:8080";
        proxy_pass $browser_app_upstream;
    }

    location = /observability/expired.json {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        set $browser_app_upstream "http://browser-app:8080";
        proxy_pass $browser_app_upstream;
    }

    # Fifth exact fixture alongside the four above, for the "config timeout"
    # scenario button: a real never-completing config fetch, not a 404 and
    # not a client-side fake. http-test-service's own pre-existing /timeout route
    # (tests/fixtures/apps/http-test-service/src/create-server.js's handleTimeout — already used
    # directly by the demo's unrelated "timeout" HTTP-request scenario)
    # sends no response headers at all and only destroys the socket after
    # 3s, well past the SDK's 2s CONFIG_FETCH_TIMEOUT_MS abort — so the
    # client's own real AbortController fires first, exactly like a load
    # balancer or origin that never answers. No new http-test-service capability, no
    # broadened proxy allowlist: this is the same "no wildcard under
    # /observability/" exact-match posture as the four fixtures above,
    # rewritten internally to an already-existing http-test-service route the same
    # way location /mock/ already does.
    location = /observability/timeout.json {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        set $http_test_service_upstream "http://http-test-service:4311";
        rewrite ^ /timeout break;
        proxy_pass $http_test_service_upstream;
    }

    include /etc/nginx/conf.d/ingestion.conf;

    location /mock/ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        set $http_test_service_upstream "http://http-test-service:4311";
        rewrite ^/mock/(.*)$ /$1 break;
        proxy_pass $http_test_service_upstream;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        set $browser_app_upstream "http://browser-app:8080";
        proxy_pass $browser_app_upstream;
    }
}
