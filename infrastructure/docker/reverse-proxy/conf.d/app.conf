server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /etc/chicek/tls/localhost.crt;
    ssl_certificate_key /etc/chicek/tls/localhost.key;

    # Docker's embedded DNS — re-resolve upstream service names at request
    # time instead of caching the IP nginx saw at startup, so a restarted
    # demo-frontend/mock-api container is picked up without a proxy reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/security.conf;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /observability/config.json {
        alias /etc/chicek/runtime-config.json;
        default_type application/json;
        add_header Content-Type "application/json" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    include /etc/nginx/conf.d/ingestion.conf;

    location /mock/ {
        set $mock_api_upstream "http://mock-api:4311";
        rewrite ^/mock/(.*)$ /$1 break;
        proxy_pass $mock_api_upstream;
    }

    location / {
        set $demo_frontend_upstream "http://demo-frontend:8080";
        proxy_pass $demo_frontend_upstream;
    }
}
