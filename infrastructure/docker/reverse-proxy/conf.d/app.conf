server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/chicek/tls/localhost.crt;
    ssl_certificate_key /etc/chicek/tls/localhost.key;

    # Docker's embedded DNS — re-resolve upstream service names at request
    # time instead of caching the IP nginx saw at startup, so a restarted
    # demo-frontend/mock-api container is picked up without a proxy reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/security.conf;

    # Stage 14 reverse-proxy kill switch: a single generated `set` directive
    # (scripts/lab/proxy-gate.mjs), included at server level so
    # $chicek_kill_switch_active is available to every location below
    # (including the two exact ingestion locations in ingestion.conf) before
    # any location-specific logic runs.
    include /etc/chicek/dynamic/proxy-gate.conf;

    location = /healthz {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /observability/config.json {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        alias /etc/chicek/runtime-config.json;
        # default_type alone is sufficient and avoids emitting a second,
        # duplicate Content-Type header (an `add_header Content-Type` here
        # previously stacked on top of it — the browser Fetch API combines
        # repeated response headers with ", ", so a real client saw
        # "application/json, application/json" and every real fetch() of
        # this endpoint failed our own isJsonContentType() check).
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /observability/control.json {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        if ($args != "") {
            return 404;
        }
        alias /etc/chicek/dynamic/runtime-control.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The demo-frontend's own static test-fixture configs (apps/demo-frontend/
    # public/observability/*.json — served by demo-frontend's nginx itself,
    # not by this proxy) back the "Lifecycle" scenario buttons in the demo UI
    # (invalid/expired/disabled config, duplicate/concurrent/conflicting
    # initialize). Without an exact-match allowlist entry each of these, they
    # fell through to ingestion.conf's blanket `location /observability/ {
    # return 404; }` — the same defense-in-depth deny that (correctly) blocks
    # anything else OpenObserve-shaped under this path — so every one of
    # those buttons failed with a generic CONFIG_HTTP_ERROR regardless of
    # what it was meant to demonstrate. These four are static, secret-free,
    # repo-committed fixture files (no different in sensitivity from
    # config.json/control.json above); listing each by exact filename here
    # preserves the "no wildcard under /observability/" security posture
    # while letting the buttons that reference them actually work again.
    location = /observability/valid-enabled.json {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        set $demo_frontend_upstream "http://demo-frontend:8080";
        proxy_pass $demo_frontend_upstream;
    }

    location = /observability/valid-disabled.json {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        set $demo_frontend_upstream "http://demo-frontend:8080";
        proxy_pass $demo_frontend_upstream;
    }

    location = /observability/invalid-schema.json {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        set $demo_frontend_upstream "http://demo-frontend:8080";
        proxy_pass $demo_frontend_upstream;
    }

    location = /observability/expired.json {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        set $demo_frontend_upstream "http://demo-frontend:8080";
        proxy_pass $demo_frontend_upstream;
    }

    include /etc/nginx/conf.d/ingestion.conf;

    location /mock/ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        set $mock_api_upstream "http://mock-api:4311";
        rewrite ^/mock/(.*)$ /$1 break;
        proxy_pass $mock_api_upstream;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        set $demo_frontend_upstream "http://demo-frontend:8080";
        proxy_pass $demo_frontend_upstream;
    }
}
