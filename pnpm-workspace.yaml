packages:
  - "apps/*"
  - "packages/*"
  - "tests/fixtures/apps/*"

catalog:
  react: 19.2.7
  react-dom: 19.2.7
  vite: 8.1.5
  "@vitejs/plugin-react": 6.0.3
  vitest: 4.1.10
  "@vitest/coverage-v8": 4.1.10
  jsdom: 29.1.1
  "@playwright/test": 1.61.1
  eslint: 10.7.0
  "@eslint/js": 10.0.1
  eslint-plugin-react: 7.37.5
  eslint-plugin-react-hooks: 7.1.1
  eslint-config-prettier: 10.1.8
  globals: 17.7.0
  prettier: 3.9.5
  ajv: 8.20.0
  ajv-formats: 3.0.1

# Dependency lifecycle scripts (install/postinstall/preinstall) are disabled
# by default for all dependencies. Nothing is allowlisted here because no
# dependency used by this workspace requires a build script to function;
# Playwright browser binaries are fetched via an explicit `playwright install`
# step in scripts/verify, never via an implicit lifecycle hook.
onlyBuiltDependencies: []

# @openobserve/browser-rum-core@0.3.4 pins the transitive `uuid` dependency
# to the exact vulnerable release 13.0.0 (GHSA-w5hq-g745-h8pq, missing buffer
# bounds check). 13.0.1/13.0.2 contain no other breaking change for this
# workspace's usage (session/request-id UUID generation only), so the
# transitive version is pinned forward to the fixed release here instead of
# waiting on an upstream @openobserve/browser-rum-core release.
overrides:
  uuid: 13.0.2
